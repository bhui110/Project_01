{% extends "base.html" %}
{% block content %}

<h1>Customers</h1>

<ul>
    {% for c in customers %}
        <li>
            <a href="{{ url_for('customer_detail', id=c.id) }}">
                {{ c.name }}
            </a>
            — {{ c.phone }}
        </li>
    {% endfor %}
</ul>

{% endblock %}
