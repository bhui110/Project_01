{% extends "base.html" %}
{% block content %}

<h1>All Products</h1>

<ul>
    <table>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Category</th>
        </tr>
        {% for p in products %}
        <tr>
            <td><strong>{{ p.name }}</strong></td>

            <td>${{ p.price }}</td>
            <td>{{ p.inventory }}</td>
            <td>
                <a href="{{ url_for('category_detail', name=p.category.name) }}">
                    {{ p.category.name }}
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</ul>

{% endblock %}
