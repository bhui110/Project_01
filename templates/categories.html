{% extends "base.html" %}
{% block content %}

<h1>All Categories</h1>

<ul>
    <table>
        <tr>
            <th>Name</th>
            <th>In-stock</th>
        </tr>
        {% for c in categories %}
        <tr>
            <td>
                <a href="{{ url_for('category_detail', name=c.name) }}">
                    {{ c.name }}
                </a>
            </td>
            <td>{{ c.products|length }}</td>
        </tr>
        {% endfor %}
    </table>
</ul>

{% endblock %}
