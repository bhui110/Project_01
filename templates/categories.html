{% extends "base.html" %}
{% block content %}

<h1>All Categories</h1>

<ul>
    {% for c in categories %}
        <li>
            <a href="{{ url_for('category_detail', name=c.name) }}">
                {{ c.name }}
            </a>
            ({{ c.products|length }} products)
        </li>
    {% endfor %}
</ul>

{% endblock %}
